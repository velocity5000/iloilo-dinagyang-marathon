<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Registration | Iloilo Dinagyang Marathon</title>

    <meta name="description" content="Verify your Heritage Run 4 registration.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- =========================
     PAGE BANNER
========================= -->

    <section class="page-banner verify-banner">

        <div class="page-banner-overlay"></div>

        <div class="page-banner-content">

            <h1>Verify Registration</h1>

            <p class="page-banner-text">

                Confirm Your Heritage Run 4 Entry

            </p>

        </div>

    </section>

    <!-- =========================
         VERIFY REGISTRATION
    ========================== -->

    <section class="verify-registration">

        <div class="container">

            <p class="section-label">

                RUNNER SERVICES

            </p>

            <h2 class="section-title">

                Verify Your Registration

            </h2>

            <p class="section-description">

                Enter the same First Name, Last Name, and Email Address used during registration to confirm your entry.

            </p>

            <!-- SEARCH CARD -->

            <form id="verifyForm" class="verify-card">

                <div class="form-group">

                    <label>First Name</label>

                    <input type="text" id="firstName" placeholder="Enter First Name" required>

                </div>

                <div class="form-group">

                    <label>Last Name</label>

                    <input type="text" id="lastName" placeholder="Enter Last Name" required>

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input type="email" id="email" placeholder="Enter Email Address" required>

                </div>

                <button type="submit" id="verifyBtn">

                    Verify Your Registration

                </button>

            </form>

            <!-- RESULT WILL APPEAR HERE -->

            <div id="resultContainer"></div>

        </div>

    </section>

    <!-- Footer -->

    <div id="footer-placeholder"></div>

    <!-- Floating Countdown -->

    <div id="floating-placeholder"></div>

    <!-- JavaScript -->

    <script src="js/layout.js"></script>

    <script src="js/verify-registration.js"></script>

</body>

</html>
